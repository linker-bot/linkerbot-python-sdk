name: Lint
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
      - name: Install python
        run: uv python install
      - run: |
          uv sync --all-groups
          uv run ruff check .
          uv run ruff format --check --diff .
          uv run ty check .
