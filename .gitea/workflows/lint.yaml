name: Lint
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.24"
          enable-cache: true
      - name: Install python
        run: uv python install
      - run: |
          uv sync --all-groups
          uvx ruff check .
          uvx ruff format --check --diff .
          uvx ty check .
