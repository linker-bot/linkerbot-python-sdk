name: Build and Publish
on:
  push:
    tags:
      - v*
jobs:
  lint:
    uses: ./.gitea/workflows/lint.yaml
    secrets: inherit
  build-and-publish:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
      - name: Install python
        run: uv python install
      - name: Build package
        run: uv build
      - name: Auth
        run: |
          uv auth login gitea.linkerhub.work --username action --password ${{ secrets.ACTION_PAT }}
      - name: Publish
        run: uv publish --index gitea-linker-bot
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.ACTION_PAT }}
