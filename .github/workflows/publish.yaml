name: Publish packages
on:
  push:
    tags:
      - v*
jobs:
  lint:
    uses: ./.gitea/workflows/lint.yaml
    secrets: inherit
  publish-pypi:
    runs-on: self-hosted
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: latest
          enable-cache: true
      - name: Install python
        run: uv python install
      - name: Build package
        run: uv build
      - name: Publish
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

